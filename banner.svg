<svg fill="none" width="1200" height="80" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          width: 100%;
          height: 80px;
          background: #0d1117;
          color: #58a6ff;
          display: flex;
          align-items: center;
          font-family: sans-serif;
          font-size: 24px;
          font-weight: bold;
          overflow: hidden;
          white-space: nowrap;
        }
        .scroll-text {
          animation: marquee 10s linear infinite;
        }
        @keyframes marquee {
          0% { transform: translateX(-50%); }
          100% { transform: translateX(0%); }
        }
      </style>
      <div class="container">
        <div class="scroll-text">
          🚀 Welcome to my repository • ⭐ Star the repo • 🔥 Open Source nbsp;nbsp; 🚀 Welcome to my repository • ⭐ Star the repo • 🔥 Open Source 
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
