<svg fill="none" width="1200" height="80" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          width: 100%;
          height: 80px;
          background: #0d1117;
          color: #F1C40F;
          display: flex;
          align-items: center;
          font-family: sans-serif;
          font-size: 24px;
          font-weight: bold;
          overflow: hidden;
          white-space: nowrap;
          border-radius: 8px;
          box-sizing: border-box;
          border: 1px solid #F1C40F;
        }
        .scroll-text {
          display: inline-block;
          white-space: nowrap;
          animation: marquee 12s linear infinite;
        }
        @keyframes marquee {
          0% { transform: translateX(0%); }
          100% { transform: translateX(-50%); }
        }
      </style>
      <div class="container">
        <div class="scroll-text">
          🚀 Welcome to my repository • ⭐ Star the repo • 🔥 Open Source &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; 🚀 Welcome to my repository • ⭐ Star the repo • 🔥 Open Source &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
